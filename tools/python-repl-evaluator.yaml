name: "python-repl-evaluator"
description: "Executes Python code cells inside the persistent RLM REPL kernel with state retention and stream capture."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: "Python code to execute in the persistent REPL environment."
    timeout_ms:
      type: integer
      description: "Maximum execution time in milliseconds before sending interrupt."
      default: 60000
    reset_state:
      type: boolean
      description: "Whether to reset REPL memory and global namespace before executing."
      default: false
  required:
    - code
